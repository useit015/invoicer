      - "T002 receipt."
      - "Original request and intake facts in goal.md."
    constraints:
      - "Do not implement."
      - "Select the largest safe useful slice, not a tiny helper."
      - "Full product path is allowed only when evidence shows it is needed."
      - "Require small-batch commit boundaries in the implementation plan."
    expected_output:
