# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Invoicely CLI Agent-Friendly Version"
  slug: "invoicely-cli-agent-friendly"
  kind: open_ended
  tranche: "Complete diagnostic intake, then map the reference project and local repo before implementing successive safe verified slices until a useful CLI and agent-facing workflow exists."
  status: done
  intake:
    original_request: "Need to make a CLI version of legions-developer/invoicely while making it agent friendly, maybe CLI plus skill."
    interpreted_outcome: "Map the reference Invoicely project, select the highest-value workflows to port, then create a CLI-first invoicing tool plus agent-friendly surfaces and possibly a companion skill."
    input_shape: vague
    audience: "Developers and coding agents operating invoice workflows locally."
    authority: requested
    proof_type: demo
    completion_proof: "Another agent can use the produced CLI docs/spec or companion skill handoff to inspect the intended Invoicely workflow scope, run or verify representative commands, and automate the next implementation slice without guessing."
    likely_misfire: "Build a thin wrapper or partial clone that does not expose stable agent-friendly commands, outputs, verification, or documentation."
    blind_spots_considered:
      - "Visual board selected: local live board."
      - "First tranche target selected: feature parity discovery."
      - "Success proof selected: agent handoff proof."
      - "Scope selected: full product path may be changed when Scout/Judge evidence supports it."
      - "CLI surface, persistence model, and companion skill scope still need clarification."
    existing_plan_facts:
      - "Use local live GoalBuddy board."
      - "First optimize for feature parity discovery before implementation."
      - "Prove usefulness through an agent handoff, not only human-facing notes."
      - "Full product path is allowed during execution if needed: CLI, backend, persistence, docs/skill, and web surfaces."
      - "Consider CLI plus Codex skill."
      - "Workspace instruction: always commit in small batches."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/invoicely-cli-agent-friendly/"
    command: "npx goalbuddy board /Users/oussmustaine/Documents/invoicer/docs/goals/invoicely-cli-agent-friendly"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the reference Invoicely project features, workflows, data model, and likely CLI parity targets."
    inputs:
      - "https://github.com/legions-developer/invoicely"
      - "Original request and intake facts in goal.md."
    constraints:
      - "Read-only."
      - "Use primary source evidence from the reference repository."
      - "Do not implement."
    expected_output:
      - "Feature/workflow map."
      - "Data and persistence model observations."
      - "Candidate CLI parity commands."
      - "Risks or gaps that need local repo evidence."
    receipt:
      result: done
      note: notes/T001-reference-invoicely-map.md
      summary: "Mapped reference Invoicely features, invoice data model, storage paths, PDF/export workflows, asset handling, and candidate agent-friendly CLI parity commands."
      evidence:
        - "https://github.com/legions-developer/invoicely"
        - "/tmp/invoicely-reference/README.md"
        - "/tmp/invoicely-reference/apps/web/src/zod-schemas/invoice/create-invoice.ts"
        - "/tmp/invoicely-reference/packages/db/src/schema/invoice.ts"
        - "/tmp/invoicely-reference/apps/web/src/trpc/services/invoice"
        - "/tmp/invoicely-reference/apps/web/src/lib/indexdb-queries/invoice.ts"
        - "/tmp/invoicely-reference/apps/web/src/app/(dashboard)/create/invoice"
