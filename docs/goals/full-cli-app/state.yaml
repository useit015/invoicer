# GoalBuddy v2 state.yaml

version: 2

goal:
  title: "Full CLI App"
  slug: "full-cli-app"
  kind: open_ended
  tranche: "Prioritize all major pro CLI dimensions together: feature-complete workflows, richer commands, cleaner architecture, stronger tests, better docs, agent handoff, and release/install polish."
  status: done
  intake:
    original_request: "Need to make this into a full CLI app with richer commands, better docs and architecture."
    interpreted_outcome: "Upgrade the existing invoicer CLI into a fuller professional CLI app across workflow breadth, architecture, docs, agent handoff, and release/install polish."
    input_shape: vague
    audience: "Developers, CLI-comfortable business users, and coding agents operating local invoicing workflows."
    authority: requested
    proof_type: demo
    completion_proof: "Full pro-ready CLI evidence: richer business capabilities beyond single-invoice CRUD, cleaner internal architecture, install/release/package polish, passing tests, workflow docs, and an agent can run representative flows without guessing."
    likely_misfire: "Add random commands without coherent architecture, stable data model, migration path, or documented workflows."
    blind_spots_considered:
      - "Fresh local board selected."
      - "User clarified: prioritize all dimensions, not only feature-complete workflow."
    existing_plan_facts:
      - "Current CLI already has invoice CRUD/status/render, themes, local asset registry, tests, README, agent handoff docs, and companion skill."
      - "Preserve small-batch commit practice."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: generated
    url: "http://goalbuddy.localhost:41737/full-cli-app/"
    command: "npx goalbuddy board /Users/oussmustaine/Documents/invoicer/docs/goals/full-cli-app"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the current CLI architecture, command surface, data model, docs, tests, and gaps for fuller invoicing workflows."
    inputs:
      - "Local repository root."
      - "Previous implemented CLI and docs."
    constraints:
      - "Read-only."
      - "Prefer concrete file-path evidence."
    expected_output:
      - "Current architecture map."
      - "Current command inventory."
      - "Verification command inventory."
      - "Ranked workflow, architecture, docs, and release-polish gaps."
      - "Candidate implementation slices."
    receipt:
      result: done
      summary: "Current CLI has invoice CRUD/status/render, themes, asset registry, tests, README, handoff docs, and skill. Gaps for a pro CLI app: no client/customer workflow, no reusable item catalog, no project config/defaults, no import/export/backup command, monolithic CLI dispatcher, and limited npm/release metadata."
      evidence:
        - "src/cli.js"
        - "src/storage.js"
        - "src/schema.js"
        - "src/render.js"
        - "src/themes.js"
        - "test/cli.test.js"
        - "README.md"
        - "docs/agent-handoff.md"
        - "package.json"
        - ".gitignore"
      command_inventory:
        - "schema"
        - "theme list/show"
        - "invoice init/validate/total/render/create/list/get/edit/delete/status"
        - "asset upload/list/delete"
      verification_commands:
        - "npm test"
        - "node src/cli.js help"
        - "node src/cli.js schema --json"
        - "node src/cli.js theme list --json"
      ranked_gaps:
        - "Reusable clients/customers and catalog items are missing, so users and agents must duplicate invoice party and item data."
        - "No config/defaults command, so theme/currency/store defaults are manual per command."
        - "No import/export/backup workflow, which limits pro CLI data portability."
        - "src/cli.js is a monolithic dispatcher; richer commands will become harder to maintain without command modules."
        - "Package metadata lacks files, repository metadata, keywords, package smoke checks, and release docs."
      candidate_slices:
        - "Add config, client, item catalog, and export/import commands with store architecture support, tests, docs, and release metadata."
        - "Refactor command dispatch into command modules before adding more features."
        - "Add packaging/release polish only, including npm pack verification and changelog."
      spawned_tasks:
        - T002
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose the largest safe useful implementation slice spanning workflow breadth, architecture, docs, and release/install polish."
    inputs:
      - "T001 receipt."
      - "Original request and intake facts."
    constraints:
      - "Do not implement."
      - "Prioritize all major pro CLI dimensions together."
      - "Require allowed_files, verify commands, stop_if, and small-batch commit guidance."
    expected_output:
      - "Decision and rationale."
      - "Exact Worker objective."
      - "allowed_files."
      - "verify commands."
      - "stop_if conditions."
      - "Commit batch guidance."
    receipt:
      result: done
      decision: "approved"
      full_outcome_complete: false
      rationale: "To prioritize all requested dimensions, the next slice should combine business workflow breadth, architecture, docs, agent handoff, tests, and package polish. The current repo is small enough for one coherent vertical slice."
      exact_worker_objective: "Refactor CLI dispatch into command modules and add pro app workflows: config/defaults, reusable clients, reusable catalog items, data export/import backup, package metadata/release docs, tests, README, agent handoff, and skill updates."
      allowed_files:
        - "package.json"
        - "README.md"
        - "CHANGELOG.md"
        - "docs/**"
        - "skills/invoicer-cli/**"
        - "src/**"
        - "test/**"
        - "examples/**"
      verify:
        - "npm test"
        - "node src/cli.js config get --json"
        - "node src/cli.js client create --name 'Acme Co' --email billing@acme.example --json"
        - "node src/cli.js item create --name 'Consulting' --unit-price 125 --json"
        - "node src/cli.js data export --out /tmp/invoicer-export.json --json"
        - "node src/cli.js data import /tmp/invoicer-export.json --store /tmp/invoicer-import-invoices.json --json"
        - "npm pack --dry-run"
        - "git diff --check"
      stop_if:
        - "Need files outside allowed_files."
        - "Need external package dependencies."
        - "Verification fails twice for the same reason."
      commit_batch_guidance:
        - "Commit architecture and richer commands after tests pass."
        - "Commit docs/package polish separately if practical."
